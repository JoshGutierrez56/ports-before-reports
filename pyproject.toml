[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-shadow-index"
version = "0.1.0"
description = "Ports Before Reports: protocol-locked shipping nowcasts and auditable AIS measurement"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "pyarrow", "duckdb", "shapely", "pyproj", "scikit-learn", "scipy", "matplotlib", "requests", "PyYAML", "psutil"]

[project.scripts]
scsi = "scsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
